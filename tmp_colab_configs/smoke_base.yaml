data:
  source: lunarcrush
  coin: btc
  data_path: data/cache/lunarcrush_btc_4hour_full.csv
  cache_dir: data/cache
  last_n_days: 365
  num_features: 18
  feature_cols:
  - 15
  - 11
  - 12
  - 9
  - 8
  - 13
  - 14
  - 17
  - 0
  - 1
  - 3
  - 4
  - 2
  - 5
  - 10
  - 16
  window_size: 30
  target_col: 3
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
model:
  type: hierarchical_quaternion_lstm_attention
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
training:
  batch_size: 32
  num_epochs: 1
  learning_rate: 0.0005
  patience: 1
  seed: 42
  max_grad_norm: 1.0
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 5
evaluation:
  metrics:
  - mape
  - directional_accuracy
  - sharpe_ratio
  - directional_accuracy_3class
  - sharpe_ratio_3class
  flat_threshold_fraction: 0.5
device: cpu
output:
  results_dir: experiments/results/4hourly_btc_lunar_hierarchy
  checkpoint_dir: checkpoints/4hourly_btc_lunar_hierarchy
